services:
  - type: web
    name: localbiz-backend
    env: node
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: free
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  - type: static
    name: localbiz-frontend
    rootDir: .
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
